[project]
name = "recruitflow-ai"
version = "0.1.0"
description = "Full-stack recruiting platform with an ML applicant/job matching layer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    # [crypto] pulls cryptography, which pypdf needs to open AES-encrypted
    # PDFs. Without it those uploads raise DependencyError instead of being
    # reported to the uploader.
    "pypdf[crypto]>=5.1",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "joblib>=1.4",
    "reportlab>=4.2",
]

[project.optional-dependencies]
# The dense encoder (app.ml.encoder). Optional because nothing else needs it
# and it brings torch; install torch's CPU-only build first to keep it small.
embeddings = [
    "sentence-transformers>=5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # For Starlette's TestClient, which imports httpx2 first and warns that
    # plain httpx is deprecated.
    "httpx2>=2.13",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
markers = [
    "slow: benchmarks and full training runs",
    "unexpected_error: the test makes the app answer an unexpected error on purpose",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
# Alembic revisions are generated; reformatting them obscures the diff against
# what autogenerate actually produced.
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/alembic/*"]
