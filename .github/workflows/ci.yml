# Lint and the full test suite on a clean install, against a real PostgreSQL.
#
# Locally the virtualenv shares Anaconda's site-packages, so most dependencies
# load from there and a local pass does not show that pyproject.toml declares
# enough. Here everything comes from `pip install -e ".[dev]"` alone.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and the one used locally.
        python-version: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway credentials for the service container above.
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow
      RECRUITFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -W default
