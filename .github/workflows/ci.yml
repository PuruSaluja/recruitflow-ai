# Lint and the full test suite on a clean install, against a real PostgreSQL,
# the encoder tests against the real sentence-transformer, and the web client,
# on its own and end to end in real browsers.
#
# Everything comes from pyproject.toml alone, so a pass here shows it declares
# enough; the local virtualenv has also shared Anaconda's site-packages.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and the one used locally.
        python-version: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway credentials for the service container above.
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow
      RECRUITFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -W default --cov --cov-report=term-missing:skip-covered

  # The web client: its API types regenerated from the committed schema must
  # match the committed ones (the test job checks the schema against the API),
  # then its tests and a production build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json allows (React Router 8 needs it), and
        # the one used locally.
        node-version: ["22.22.0", "24"]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: API types match the schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build

  # The built client served by the API, with a migrated database and a trained
  # matcher, driven in Chromium, Firefox, WebKit and a phone-sized Chromium.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          cd frontend && npm ci

      - name: Migrate, train the matcher, build the client
        run: |
          alembic upgrade head
          python scripts/train_matcher.py
          cd frontend && npm run build

      - name: Start the API
        run: |
          nohup uvicorn app.main:app --app-dir backend --port 8000 > uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Install the browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Server log
        if: failure()
        run: cat uvicorn.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The embeddings extra brings torch, which the main job leaves out, so the
  # tests that load the real models skip there. This job installs it (the CPU
  # build) and sets RECRUITFLOW_REQUIRE_ENCODER, so a model that fails to load
  # fails the job instead of skipping.
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow
      RECRUITFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow_test
      RECRUITFLOW_REQUIRE_ENCODER: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Keyed on the pinned revisions in app/ml/encoder.py and cross_encoder.py.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/ml/encoder.py', 'backend/app/ml/cross_encoder.py') }}

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,embeddings]"

      - name: Test the encoder and the cross-encoder
        run: pytest -W default -rs backend/tests/test_encoder.py backend/tests/test_cross_encoder.py

      # A separate call: -k would also filter test_encoder.py.
      - name: Test the evaluation's dense scorer against the real model
        run: pytest -W default -rs backend/tests/test_evaluate_matcher.py -k real_model
