# Lint and the full test suite on a clean install, against a real PostgreSQL,
# and the encoder tests against the real sentence-transformer.
#
# Everything comes from pyproject.toml alone, so a pass here shows it declares
# enough; the local virtualenv has also shared Anaconda's site-packages.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject.toml allows, and the one used locally.
        python-version: ["3.11", "3.14"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruitflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway credentials for the service container above.
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow
      RECRUITFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -W default

  # The embeddings extra brings torch, which the main job leaves out, so the
  # tests that load the real model skip there. This job installs it (the CPU
  # build) and sets RECRUITFLOW_REQUIRE_ENCODER, so a model that fails to load
  # fails the job instead of skipping.
  embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RECRUITFLOW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow
      RECRUITFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recruitflow_test
      RECRUITFLOW_REQUIRE_ENCODER: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Keyed on the pinned revision in app/ml/encoder.py.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/app/ml/encoder.py') }}

      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,embeddings]"

      - name: Test the encoder
        run: pytest -W default -rs backend/tests/test_encoder.py
