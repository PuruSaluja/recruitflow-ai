# Dependabot opens a pull request when something the project depends on has a
# newer release. CI runs on each one, so an upgrade is seen to pass before it
# is merged.
version: 2
updates:
  # The web client. package.json pins exact versions and nothing in CI installs
  # newer ones, so without these the client's dependencies only move by hand.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # A release has to be a week old: one that is withdrawn is usually
    # withdrawn within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # react-dom runs only with the react of its own version, so the two and
      # their types move in one pull request, a new major included.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Everything else that is not a new major, in one pull request a week.
      # A new major comes on its own, to be read on its own.
      client:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Types for the Node the client is built with, 24, not the newest Node.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # Python gets no version updates. pyproject.toml gives the oldest version
  # each dependency was used with, and CI's "newest" jobs install the newest
  # releases on every push, so a release that breaks the suite already shows.
  # constraints.txt is the development environment's versions, which CI's
  # "pinned" job runs; moved by a bot it would be a second "newest" and no
  # longer what is installed. Security updates do not count against the limit:
  # with Dependabot alerts and security updates on for the repository, a
  # version with a published advisory still gets its pull request.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
